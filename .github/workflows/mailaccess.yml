name: Email OSINT Audit

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string

      email:
        description: "Alamat email yang diperiksa"
        required: true
        type: string

      profile:
        description: "Profil pemeriksaan"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - standard
          - extended

permissions:
  contents: read

concurrency:
  group: mailaccess-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Jalankan pemeriksaan email
    runs-on: ubuntu-latest

    timeout-minutes: 90

    env:
      JOB_ID: ${{ inputs.job_id }}
      EMAIL_INPUT: ${{ inputs.email }}
      PROFILE_INPUT: ${{ inputs.profile }}

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tampilkan versi Python
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

      - name: Perbarui alat instalasi
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

      - name: Instal MailAccess
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            "mailaccess==0.14.4"

      - name: Periksa instalasi MailAccess
        shell: bash
        run: |
          set -euo pipefail

          python -m pip show mailaccess

          echo
          echo "Versi MailAccess:"
          mailaccess --version

          echo
          echo "Bantuan investigate:"
          mailaccess investigate --help

      - name: Validasi ID pekerjaan
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$JOB_ID" |
            grep -Eq '^[a-fA-F0-9-]{20,50}$'; then
            echo "ID pekerjaan tidak valid."
            exit 1
          fi

          echo "ID pekerjaan valid."

      - name: Validasi alamat email
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re

          email = os.environ.get(
              "EMAIL_INPUT",
              "",
          ).strip()

          if not email:
              raise SystemExit(
                  "Alamat email belum tersedia."
              )

          if len(email) > 254:
              raise SystemExit(
                  "Alamat email melebihi 254 karakter."
              )

          if email.count("@") != 1:
              raise SystemExit(
                  "Alamat email harus memiliki "
                  "tepat satu karakter @."
              )

          local_part, domain_part = email.rsplit(
              "@",
              1,
          )

          if not local_part:
              raise SystemExit(
                  "Bagian sebelum @ tidak boleh kosong."
              )

          if len(local_part) > 64:
              raise SystemExit(
                  "Bagian sebelum @ melebihi 64 karakter."
              )

          if (
              local_part.startswith(".")
              or local_part.endswith(".")
              or ".." in local_part
          ):
              raise SystemExit(
                  "Penempatan titik pada email tidak valid."
              )

          local_pattern = re.compile(
              r"^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+$"
          )

          domain_pattern = re.compile(
              r"^(?=.{1,253}$)"
              r"(?:"
              r"[A-Za-z0-9]"
              r"(?:[A-Za-z0-9-]{0,61}"
              r"[A-Za-z0-9])?"
              r"\."
              r")+"
              r"[A-Za-z]{2,63}$"
          )

          if not local_pattern.fullmatch(
              local_part
          ):
              raise SystemExit(
                  "Bagian sebelum @ memiliki "
                  "karakter yang tidak valid."
              )

          if not domain_pattern.fullmatch(
              domain_part
          ):
              raise SystemExit(
                  "Domain alamat email tidak valid."
              )

          normalized_email = (
              local_part
              + "@"
              + domain_part.lower()
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as environment_file:
              environment_file.write(
                  "NORMALIZED_EMAIL="
                  + normalized_email
                  + "\n"
              )

          print("Format alamat email valid.")
          print("Domain:", domain_part.lower())
          PY

      - name: Validasi profil pemeriksaan
        shell: bash
        run: |
          set -euo pipefail

          case "$PROFILE_INPUT" in
            basic|standard|extended)
              echo "Profil valid: $PROFILE_INPUT"
              ;;
            *)
              echo "Profil pemeriksaan tidak valid."
              exit 1
              ;;
          esac

      - name: Siapkan folder laporan
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          rm -rf "$REPORT_FOLDER"

          mkdir -p "$REPORT_FOLDER"

          echo "Folder laporan:"
          echo "$REPORT_FOLDER"

      - name: Simpan daftar modul
        shell: bash
        run: |
          set -euo pipefail

          mailaccess modules \
            > "reports/$JOB_ID/modules.txt" \
            2>&1 || true

          cat "reports/$JOB_ID/modules.txt"

      - name: Tentukan konfigurasi pemeriksaan
        id: config
        shell: bash
        run: |
          set -euo pipefail

          case "$PROFILE_INPUT" in
            basic)
              MODULES="gravatar,domain_intel"
              TIMEOUT="30"
              ENABLE=""
              ;;

            standard)
              MODULES="gravatar,domain_intel,emailrep"
              TIMEOUT="45"
              ENABLE=""
              ;;

            extended)
              MODULES=""
              TIMEOUT="60"
              ENABLE="all"
              ;;
          esac

          {
            echo "modules=$MODULES"
            echo "timeout=$TIMEOUT"
            echo "enable=$ENABLE"
          } >> "$GITHUB_OUTPUT"

          echo "Profil: $PROFILE_INPUT"
          echo "Timeout: $TIMEOUT detik"

          if [ -n "$MODULES" ]; then
            echo "Modul utama: $MODULES"
          else
            echo "Modul utama: bawaan MailAccess"
          fi

          if [ -n "$ENABLE" ]; then
            echo "Modul opt-in: $ENABLE"
          fi

      - name: Jalankan pemeriksaan basic atau standard
        if: steps.config.outputs.modules != ''
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          REPORT_FILE="$REPORT_FOLDER/report.json"

          echo "Memulai pemeriksaan email."
          echo "Profil: $PROFILE_INPUT"

          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --modules \
            "${{ steps.config.outputs.modules }}" \
            --timeout \
            "${{ steps.config.outputs.timeout }}" \
            --force \
            --output "$REPORT_FILE"

      - name: Jalankan pemeriksaan extended
        if: steps.config.outputs.modules == ''
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          REPORT_FILE="$REPORT_FOLDER/report.json"

          echo "Memulai pemeriksaan extended."

          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --timeout \
            "${{ steps.config.outputs.timeout }}" \
            --force \
            --show-collisions \
            --enable \
            "${{ steps.config.outputs.enable }}" \
            --output "$REPORT_FILE"

      - name: Temukan dan normalisasi laporan JSON
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          EXPECTED_FILE="$REPORT_FOLDER/report.json"

          if [ -s "$EXPECTED_FILE" ]; then
            echo "Laporan JSON tersedia."
            exit 0
          fi

          FOUND_FILE="$(
            find "$REPORT_FOLDER" \
              -maxdepth 4 \
              -type f \
              -name '*.json' \
              ! -name 'metadata.json' \
              -print |
              head -n 1
          )"

          if [ -z "$FOUND_FILE" ]; then
            echo "Laporan JSON tidak ditemukan."
            exit 1
          fi

          cp "$FOUND_FILE" "$EXPECTED_FILE"

          echo "Laporan dinormalisasi dari:"
          echo "$FOUND_FILE"

      - name: Validasi dan analisis laporan JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          report_path = (
              Path("reports")
              / job_id
              / "report.json"
          )

          if not report_path.exists():
              raise SystemExit(
                  "Laporan JSON tidak ditemukan."
              )

          if report_path.stat().st_size == 0:
              raise SystemExit(
                  "Laporan JSON kosong."
              )

          try:
              report = json.loads(
                  report_path.read_text(
                      encoding="utf-8"
                  )
              )
          except json.JSONDecodeError as error:
              raise SystemExit(
                  "Laporan bukan JSON valid."
              ) from error

          if not isinstance(report, dict):
              raise SystemExit(
                  "Struktur utama laporan harus "
                  "berupa object JSON."
              )

          status = str(
              report.get("status", "")
          ).lower()

          if status not in {
              "complete",
              "completed",
          }:
              raise SystemExit(
                  "Investigasi tidak selesai. "
                  "Status: "
                  + status
              )

          findings = report.get(
              "findings",
              [],
          )

          module_runs = report.get(
              "module_runs",
              [],
          )

          if not isinstance(findings, list):
              findings = []

          if not isinstance(module_runs, list):
              module_runs = []

          module_statuses = Counter(
              str(item.get("status", "unknown"))
              for item in module_runs
              if isinstance(item, dict)
          )

          direct_findings = 0
          username_pivots = 0

          for finding in findings:
              if not isinstance(finding, dict):
                  continue

              module_name = str(
                  finding.get(
                      "module_name",
                      "",
                  )
              )

              if module_name == "username_pivot":
                  username_pivots += 1
              else:
                  direct_findings += 1

          analysis = {
              "status": status,
              "findingCount": len(findings),
              "directFindingCount": direct_findings,
              "usernamePivotCount": username_pivots,
              "moduleRunCount": len(module_runs),
              "moduleStatuses": dict(
                  module_statuses
              ),
              "exposureScore": report.get(
                  "exposure_score"
              ),
              "exposureScorePct": report.get(
                  "exposure_score_pct"
              ),
              "credentialRiskScore": report.get(
                  "credential_risk_score"
              ),
              "credentialRiskBand": report.get(
                  "credential_risk_band"
              ),
              "riskLevel": report.get(
                  "risk_level"
              ),
              "nameConfidence": report.get(
                  "name_confidence"
              ),
          }

          analysis_path = (
              report_path.parent
              / "analysis.json"
          )

          analysis_path.write_text(
              json.dumps(
                  analysis,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("Laporan JSON valid.")
          print("Temuan:", len(findings))
          print(
              "Pivot username:",
              username_pivots,
          )
          print(
              "Temuan langsung:",
              direct_findings,
          )
          print(
              "Status modul:",
              dict(module_statuses),
          )
          PY

      - name: Buat CSV dari snapshot JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          folder = (
              Path("reports")
              / job_id
          )

          report = json.loads(
              (
                  folder
                  / "report.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          findings = report.get(
              "findings",
              [],
          )

          if not isinstance(findings, list):
              findings = []

          output_path = (
              folder
              / "report.csv"
          )

          with output_path.open(
              "w",
              encoding="utf-8",
              newline="",
          ) as output_file:
              writer = csv.DictWriter(
                  output_file,
                  fieldnames=[
                      "module_name",
                      "platform",
                      "profile_url",
                      "username",
                      "confidence",
                      "severity",
                      "source",
                      "created_at",
                      "metadata_json",
                  ],
              )

              writer.writeheader()

              for finding in findings:
                  if not isinstance(finding, dict):
                      continue

                  data = finding.get(
                      "data",
                      {},
                  )

                  if not isinstance(data, dict):
                      data = {}

                  metadata = data.get(
                      "metadata",
                      {},
                  )

                  if not isinstance(metadata, dict):
                      metadata = {}

                  writer.writerow({
                      "module_name":
                          finding.get(
                              "module_name",
                              "",
                          ),
                      "platform":
                          data.get(
                              "platform",
                              "",
                          ),
                      "profile_url":
                          data.get(
                              "profile_url",
                              data.get(
                                  "url",
                                  "",
                              ),
                          ),
                      "username":
                          data.get(
                              "username",
                              "",
                          ),
                      "confidence":
                          data.get(
                              "confidence",
                              "",
                          ),
                      "severity":
                          data.get(
                              "severity",
                              "",
                          ),
                      "source":
                          metadata.get(
                              "source",
                              "",
                          ),
                      "created_at":
                          finding.get(
                              "created_at",
                              "",
                          ),
                      "metadata_json":
                          json.dumps(
                              metadata,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })

          print(
              "CSV dibuat:",
              output_path,
          )
          PY

      - name: Buat Markdown dari snapshot JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          folder = (
              Path("reports")
              / job_id
          )

          report = json.loads(
              (
                  folder
                  / "report.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          findings = report.get(
              "findings",
              [],
          )

          module_runs = report.get(
              "module_runs",
              [],
          )

          if not isinstance(findings, list):
              findings = []

          if not isinstance(module_runs, list):
              module_runs = []

          module_statuses = Counter(
              str(run.get("status", "unknown"))
              for run in module_runs
              if isinstance(run, dict)
          )

          pivot_findings = []
          direct_findings = []

          for finding in findings:
              if not isinstance(finding, dict):
                  continue

              if (
                  finding.get("module_name")
                  == "username_pivot"
              ):
                  pivot_findings.append(
                      finding
                  )
              else:
                  direct_findings.append(
                      finding
                  )

          lines = [
              "# Email OSINT Audit",
              "",
              "## Ringkasan",
              "",
              "- Email: `"
              + os.environ["NORMALIZED_EMAIL"]
              + "`",
              "- Profil: `"
              + os.environ["PROFILE_INPUT"]
              + "`",
              "- Status: `"
              + str(report.get("status", ""))
              + "`",
              "- Risk level: `"
              + str(
                  report.get(
                      "risk_level",
                      "Tidak tersedia",
                  )
              )
              + "`",
              "- Exposure score: `"
              + str(
                  report.get(
                      "exposure_score",
                      "Tidak tersedia",
                  )
              )
              + "`",
              "- Credential risk score: `"
              + str(
                  report.get(
                      "credential_risk_score",
                      "Tidak tersedia",
                  )
              )
              + "`",
              "- Temuan langsung: `"
              + str(len(direct_findings))
              + "`",
              "- Kandidat pivot username: `"
              + str(len(pivot_findings))
              + "`",
              "",
              "## Status Modul",
              "",
          ]

          for status, count in sorted(
              module_statuses.items()
          ):
              lines.append(
                  "- "
                  + status
                  + ": `"
                  + str(count)
                  + "`"
              )

          lines.extend([
              "",
              "## Ringkasan Sistem",
              "",
              str(
                  report.get(
                      "summary",
                      "Tidak tersedia",
                  )
              ),
              "",
              "## Catatan Interpretasi",
              "",
              (
                  "Kandidat profil berdasarkan bagian lokal "
                  "alamat email bukan bukti bahwa setiap profil "
                  "dimiliki oleh pemilik alamat email."
              ),
              "",
              (
                  "Setiap kandidat harus diverifikasi menggunakan "
                  "sumber independen sebelum dikaitkan dengan "
                  "identitas tertentu."
              ),
              "",
              "## Temuan Langsung",
              "",
          ])

          if not direct_findings:
              lines.append(
                  "Tidak ada temuan langsung."
              )

          for index, finding in enumerate(
              direct_findings,
              start=1,
          ):
              data = finding.get(
                  "data",
                  {},
              )

              if not isinstance(data, dict):
                  data = {}

              lines.extend([
                  "### "
                  + str(index)
                  + ". "
                  + str(
                      data.get(
                          "platform",
                          finding.get(
                              "module_name",
                              "Temuan",
                          ),
                      )
                  ),
                  "",
                  "- Modul: `"
                  + str(
                      finding.get(
                          "module_name",
                          "",
                      )
                  )
                  + "`",
                  "- Confidence: `"
                  + str(
                      data.get(
                          "confidence",
                          "Tidak tersedia",
                      )
                  )
                  + "`",
                  "- Severity: `"
                  + str(
                      data.get(
                          "severity",
                          "Tidak tersedia",
                      )
                  )
                  + "`",
                  "",
              ])

          lines.extend([
              "",
              "## Kandidat Pivot Username",
              "",
          ])

          for index, finding in enumerate(
              pivot_findings,
              start=1,
          ):
              data = finding.get(
                  "data",
                  {},
              )

              if not isinstance(data, dict):
                  data = {}

              platform = str(
                  data.get(
                      "platform",
                      "Tidak diketahui",
                  )
              )

              profile_url = str(
                  data.get(
                      "profile_url",
                      "",
                  )
              )

              confidence = str(
                  data.get(
                      "confidence",
                      "Tidak tersedia",
                  )
              )

              lines.append(
                  str(index)
                  + ". "
                  + platform
                  + " | confidence: `"
                  + confidence
                  + "`"
                  + (
                      " | "
                      + profile_url
                      if profile_url
                      else ""
                  )
              )

          output_path = (
              folder
              / "summary.md"
          )

          output_path.write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print(
              "Markdown dibuat:",
              output_path,
          )
          PY

      - name: Buat metadata pekerjaan
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import (
              datetime,
              timezone,
          )
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          folder = (
              Path("reports")
              / job_id
          )

          generated_files = sorted(
              path.name
              for path in folder.iterdir()
              if path.is_file()
          )

          metadata = {
              "jobId": job_id,
              "email": os.environ[
                  "NORMALIZED_EMAIL"
              ],
              "profile": os.environ[
                  "PROFILE_INPUT"
              ],
              "status": "completed",
              "createdAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "repository": os.environ.get(
                  "GITHUB_REPOSITORY",
                  "",
              ),
              "githubRunId": os.environ.get(
                  "GITHUB_RUN_ID",
                  "",
              ),
              "githubRunAttempt": os.environ.get(
                  "GITHUB_RUN_ATTEMPT",
                  "",
              ),
              "primaryReport": "report.json",
              "generatedFilesBeforeMetadata":
                  generated_files,
              "authorizedUseOnly": True,
          }

          output_path = (
              folder
              / "metadata.json"
          )

          output_path.write_text(
              json.dumps(
                  metadata,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "Metadata dibuat:",
              output_path,
          )
          PY

      - name: Hapus file diagnostik dari paket utama
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            "reports/$JOB_ID/modules.txt"

      - name: Buat checksum
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          rm -f \
            "$REPORT_FOLDER/SHA256SUMS.txt"

          find "$REPORT_FOLDER" \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > "$REPORT_FOLDER/SHA256SUMS.txt"

      - name: Validasi paket laporan
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          REQUIRED_FILES=(
            "report.json"
            "report.csv"
            "summary.md"
            "analysis.json"
            "metadata.json"
            "SHA256SUMS.txt"
          )

          for FILE_NAME in \
            "${REQUIRED_FILES[@]}"; do
            FILE_PATH="$REPORT_FOLDER/$FILE_NAME"

            if [ ! -s "$FILE_PATH" ]; then
              echo "File tidak tersedia atau kosong:"
              echo "$FILE_PATH"
              exit 1
            fi
          done

          echo "Seluruh file wajib tersedia."

          find "$REPORT_FOLDER" \
            -maxdepth 1 \
            -type f \
            -printf '%f | %s byte\n' |
            sort

      - name: Periksa sintaks pengirim
        shell: bash
        run: |
          set -euo pipefail

          if [
            ! -f \
            "scripts/send_to_apps_script.py"
          ]; then
            echo \
              "scripts/send_to_apps_script.py belum tersedia."
            exit 1
          fi

          python -m py_compile \
            scripts/send_to_apps_script.py

          echo "Sintaks pengirim valid."

      - name: Periksa konfigurasi webhook
        id: webhook
        env:
          APPS_SCRIPT_WEBHOOK_URL: >-
            ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}

          CALLBACK_SECRET: >-
            ${{ secrets.CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          ENABLED="false"

          if [
            -n "$APPS_SCRIPT_WEBHOOK_URL"
          ] && [
            -n "$CALLBACK_SECRET"
          ]; then
            ENABLED="true"

            echo \
              "Webhook tersedia. Laporan akan dikirim."
          else
            echo \
              "Webhook belum tersedia. Pengiriman dilewati."

            echo \
              "Artefak tetap akan disimpan."
          fi

          echo "enabled=$ENABLED" \
            >> "$GITHUB_OUTPUT"

      - name: Kirim laporan ke Apps Script
        if: steps.webhook.outputs.enabled == 'true'
        env:
          APPS_SCRIPT_WEBHOOK_URL: >-
            ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}

          CALLBACK_SECRET: >-
            ${{ secrets.CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          python \
            scripts/send_to_apps_script.py \
            "reports/$JOB_ID"

      - name: Laporkan kegagalan ke Apps Script
        if: failure() && steps.webhook.outputs.enabled == 'true'
        env:
          APPS_SCRIPT_WEBHOOK_URL: >-
            ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}

          CALLBACK_SECRET: >-
            ${{ secrets.CALLBACK_SECRET }}
        shell: bash
        run: |
          python \
            scripts/send_to_apps_script.py \
            --failed \
            "$JOB_ID" \
            "Workflow Email OSINT Audit gagal." \
            || true

      - name: Simpan artefak laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailaccess-${{ inputs.job_id }}
          path: reports/${{ inputs.job_id }}/
          retention-days: 7
          if-no-files-found: warn