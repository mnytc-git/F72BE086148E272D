name: Email OSINT Audit

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string

      email:
        description: "Alamat email yang diperiksa"
        required: true
        type: string

      profile:
        description: "Profil pemeriksaan"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - standard
          - extended

permissions:
  contents: read

concurrency:
  group: mailaccess-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Jalankan pemeriksaan email
    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      JOB_ID: ${{ inputs.job_id }}
      EMAIL_INPUT: ${{ inputs.email }}
      PROFILE_INPUT: ${{ inputs.profile }}

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tampilkan versi Python
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

      - name: Perbarui alat instalasi
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

      - name: Instal MailAccess
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            "mailaccess==0.14.4"

      - name: Tampilkan informasi MailAccess
        shell: bash
        run: |
          set -euo pipefail

          python -m pip show mailaccess

          echo
          echo "Bantuan MailAccess:"
          echo

          mailaccess --help

          echo
          echo "Bantuan perintah investigate:"
          echo

          mailaccess investigate --help

      - name: Validasi masukan
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$JOB_ID" |
            grep -Eq '^[a-fA-F0-9-]{20,50}$'; then
            echo "ID pekerjaan tidak valid."
            exit 1
          fi

          python - <<'PY'
          import os
          import re

          email = os.environ.get(
              "EMAIL_INPUT",
              "",
          ).strip()

          pattern = re.compile(
              r"^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+"
              r"@?:[A-Za-z0-9-]{0,61}"
              r"[A-Za-z0-9]?"
              r"(?:\.?:[A-Za-z0-9-]{0,61}"
              r"[A-Za-z0-9]?)+$"
          )

          if len(email) > 254:
              raise SystemExit(
                  "Alamat email terlalu panjang."
              )

          if not pattern.fullmatch(email):
              raise SystemExit(
                  "Format alamat email tidak valid."
              )

          print(
              "Format alamat email valid."
          )
          PY

          case "$PROFILE_INPUT" in
            basic|standard|extended)
              ;;
            *)
              echo "Profil pemeriksaan tidak valid."
              exit 1
              ;;
          esac

      - name: Siapkan folder laporan
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          rm -rf "$REPORT_FOLDER"

          mkdir -p "$REPORT_FOLDER"

          echo "Folder laporan: $REPORT_FOLDER"

      - name: Tentukan modul pemeriksaan
        id: modules
        shell: bash
        run: |
          set -euo pipefail

          case "$PROFILE_INPUT" in
            basic)
              MODULES="gravatar,domain_intel"
              ;;

            standard)
              MODULES="gravatar,domain_intel,emailrep"
              ;;

            extended)
              MODULES=""
              ;;
          esac

          printf 'modules=%s\n' "$MODULES" \
            >> "$GITHUB_OUTPUT"

          if [ -n "$MODULES" ]; then
            echo "Profil: $PROFILE_INPUT"
            echo "Modul: $MODULES"
          else
            echo "Profil: $PROFILE_INPUT"
            echo "Menggunakan modul bawaan yang tersedia."
          fi

      - name: Jalankan pemeriksaan dasar
        if: steps.modules.outputs.modules != ''
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          REPORT_FILE="$REPORT_FOLDER/report.json"

          echo "Memulai pemeriksaan email."
          echo "Profil: $PROFILE_INPUT"

          mailaccess investigate \
            "$EMAIL_INPUT" \
            --modules \
            "${{ steps.modules.outputs.modules }}" \
            -o "$REPORT_FILE"

      - name: Jalankan pemeriksaan lengkap
        if: steps.modules.outputs.modules == ''
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          REPORT_FILE="$REPORT_FOLDER/report.json"

          echo "Memulai pemeriksaan lengkap."
          echo "Profil: $PROFILE_INPUT"

          mailaccess investigate \
            "$EMAIL_INPUT" \
            -o "$REPORT_FILE"

      - name: Cari laporan yang dihasilkan
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          echo "Isi folder laporan:"

          find "$REPORT_FOLDER" \
            -maxdepth 2 \
            -type f \
            -printf '%p | %s byte\n' |
            sort

      - name: Normalisasi lokasi laporan JSON
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          EXPECTED_FILE="$REPORT_FOLDER/report.json"

          if [ -s "$EXPECTED_FILE" ]; then
            echo "Laporan ditemukan di lokasi utama."
            exit 0
          fi

          FOUND_FILE="$(
            find "$REPORT_FOLDER" \
              -maxdepth 3 \
              -type f \
              -name '*.json' \
              ! -name 'metadata.json' \
              -print |
              head -n 1
          )"

          if [ -z "$FOUND_FILE" ]; then
            echo "Laporan JSON tidak ditemukan."
            exit 1
          fi

          cp "$FOUND_FILE" "$EXPECTED_FILE"

          echo "Laporan disalin dari:"
          echo "$FOUND_FILE"

      - name: Validasi laporan JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          report_path = (
              Path("reports")
              / job_id
              / "report.json"
          )

          if not report_path.exists():
              raise SystemExit(
                  "Laporan JSON tidak ditemukan."
              )

          if report_path.stat().st_size == 0:
              raise SystemExit(
                  "Laporan JSON kosong."
              )

          try:
              report = json.loads(
                  report_path.read_text(
                      encoding="utf-8"
                  )
              )
          except json.JSONDecodeError as error:
              preview = report_path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )[:500]

              raise SystemExit(
                  "Laporan bukan JSON valid. "
                  "Isi awal: "
                  + preview
              ) from error

          if not isinstance(
              report,
              dict,
          ):
              raise SystemExit(
                  "Struktur utama laporan "
                  "harus berupa object JSON."
              )

          print(
              "Laporan JSON valid."
          )

          print(
              "Ukuran laporan:",
              report_path.stat().st_size,
              "byte",
          )

          print(
              "Field tingkat atas:"
          )

          for key in sorted(
              report.keys()
          ):
              print(
                  "- " + str(key)
              )
          PY

      - name: Buat metadata pekerjaan
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import (
              datetime,
              timezone,
          )
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          report_folder = (
              Path("reports")
              / job_id
          )

          report_files = sorted(
              path.name
              for path in report_folder.iterdir()
              if path.is_file()
          )

          metadata = {
              "jobId": job_id,
              "email": os.environ[
                  "EMAIL_INPUT"
              ],
              "profile": os.environ[
                  "PROFILE_INPUT"
              ],
              "status": "completed",
              "createdAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "reportFile": "report.json",
              "filesBeforeMetadata": (
                  report_files
              ),
              "authorizedUseOnly": True,
          }

          metadata_path = (
              report_folder
              / "metadata.json"
          )

          metadata_path.write_text(
              json.dumps(
                  metadata,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "Metadata dibuat:",
              metadata_path,
          )
          PY

      - name: Buat ringkasan Markdown
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          report_folder = (
              Path("reports")
              / job_id
          )

          report_path = (
              report_folder
              / "report.json"
          )

          report = json.loads(
              report_path.read_text(
                  encoding="utf-8"
              )
          )

          findings = report.get(
              "findings",
              [],
          )

          if not isinstance(
              findings,
              list,
          ):
              findings = []

          exposure_score = report.get(
              "exposure_score",
              report.get(
                  "exposureScore",
                  "Tidak tersedia",
              ),
          )

          risk_level = report.get(
              "risk_level",
              report.get(
                  "riskLevel",
                  "Tidak tersedia",
              ),
          )

          status = report.get(
              "status",
              "Tidak tersedia",
          )

          lines = [
              "# Email OSINT Audit",
              "",
              "## Metadata",
              "",
              "- Email: `"
              + os.environ["EMAIL_INPUT"]
              + "`",
              "- Profil: `"
              + os.environ["PROFILE_INPUT"]
              + "`",
              "- Status: `"
              + str(status)
              + "`",
              "- Exposure score: `"
              + str(exposure_score)
              + "`",
              "- Risk level: `"
              + str(risk_level)
              + "`",
              "- Jumlah temuan: `"
              + str(len(findings))
              + "`",
              "",
              "## Temuan Lengkap",
              "",
          ]

          if not findings:
              lines.append(
                  "Tidak ada temuan terstruktur "
                  "pada field findings."
              )
          else:
              for index, finding in enumerate(
                  findings,
                  start=1,
              ):
                  if not isinstance(
                      finding,
                      dict,
                  ):
                      lines.extend([
                          "### Temuan "
                          + str(index),
                          "",
                          "```text",
                          str(finding),
                          "```",
                          "",
                      ])

                      continue

                  platform = finding.get(
                      "platform",
                      "Tidak diketahui",
                  )

                  confidence = finding.get(
                      "confidence",
                      "Tidak tersedia",
                  )

                  severity = finding.get(
                      "severity",
                      "Tidak tersedia",
                  )

                  url = finding.get(
                      "url",
                      "",
                  )

                  metadata = finding.get(
                      "metadata",
                      {},
                  )

                  lines.extend([
                      "### "
                      + str(index)
                      + ". "
                      + str(platform),
                      "",
                      "- Confidence: `"
                      + str(confidence)
                      + "`",
                      "- Severity: `"
                      + str(severity)
                      + "`",
                  ])

                  if url:
                      lines.append(
                          "- URL: "
                          + str(url)
                      )

                  if metadata:
                      lines.extend([
                          "",
                          "Metadata:",
                          "",
                          "```json",
                          json.dumps(
                              metadata,
                              indent=2,
                              ensure_ascii=False,
                          ),
                          "```",
                      ])

                  lines.append("")

          lines.extend([
              "",
              "## Laporan JSON Lengkap",
              "",
              "```json",
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False,
              ),
              "```",
              "",
          ])

          summary_path = (
              report_folder
              / "summary.md"
          )

          summary_path.write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print(
              "Ringkasan dibuat:",
              summary_path,
          )
          PY

      - name: Buat checksum
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          find "$REPORT_FOLDER" \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > "$REPORT_FOLDER/SHA256SUMS.txt"

      - name: Tampilkan daftar laporan
        shell: bash
        run: |
          set -euo pipefail

          echo "Laporan akhir:"

          find "reports/$JOB_ID" \
            -maxdepth 1 \
            -type f \
            -printf '%f | %s byte\n' |
            sort

      - name: Simpan artefak laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailaccess-${{ inputs.job_id }}
          path: reports/${{ inputs.job_id }}/
          retention-days: 7
          if-no-files-found: warn