name: Email OSINT Audit

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string

      email:
        description: "Alamat email yang diperiksa"
        required: true
        type: string

      profile:
        description: "Profil pemeriksaan"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - standard
          - extended

permissions:
  contents: read

concurrency:
  group: mailaccess-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Jalankan pemeriksaan email
    runs-on: ubuntu-latest

    timeout-minutes: 90

    env:
      JOB_ID: ${{ inputs.job_id }}
      EMAIL_INPUT: ${{ inputs.email }}
      PROFILE_INPUT: ${{ inputs.profile }}

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tampilkan versi Python
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

      - name: Perbarui alat instalasi
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

      - name: Instal MailAccess
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            "mailaccess==0.14.4"

      - name: Periksa instalasi MailAccess
        shell: bash
        run: |
          set -euo pipefail

          python -m pip show mailaccess

          echo
          echo "Versi MailAccess:"
          mailaccess --version

          echo
          echo "Daftar perintah:"
          mailaccess commands || true

          echo
          echo "Bantuan investigate:"
          mailaccess investigate --help

      - name: Validasi ID pekerjaan
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$JOB_ID" |
            grep -Eq '^[a-fA-F0-9-]{20,50}$'; then
            echo "ID pekerjaan tidak valid."
            exit 1
          fi

          echo "ID pekerjaan valid."

      - name: Validasi alamat email
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re

          email = os.environ.get(
              "EMAIL_INPUT",
              "",
          ).strip()

          if not email:
              raise SystemExit(
                  "Alamat email belum tersedia."
              )

          if len(email) > 254:
              raise SystemExit(
                  "Alamat email melebihi 254 karakter."
              )

          if email.count("@") != 1:
              raise SystemExit(
                  "Alamat email harus memiliki "
                  "tepat satu karakter @."
              )

          local_part, domain_part = email.rsplit(
              "@",
              1,
          )

          if not local_part:
              raise SystemExit(
                  "Bagian sebelum @ tidak boleh kosong."
              )

          if len(local_part) > 64:
              raise SystemExit(
                  "Bagian sebelum @ melebihi "
                  "64 karakter."
              )

          if not domain_part:
              raise SystemExit(
                  "Domain email tidak boleh kosong."
              )

          local_pattern = re.compile(
              r"^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+$"
          )

          domain_pattern = re.compile(
              r"^(?=.{1,253}$)"
              r"(?:"
              r"[A-Za-z0-9]"
              r"(?:[A-Za-z0-9-]{0,61}"
              r"[A-Za-z0-9])?"
              r"\."
              r")+"
              r"[A-Za-z]{2,63}$"
          )

          if not local_pattern.fullmatch(
              local_part
          ):
              raise SystemExit(
                  "Bagian sebelum @ mengandung "
                  "karakter yang tidak valid."
              )

          if (
              local_part.startswith(".")
              or local_part.endswith(".")
              or ".." in local_part
          ):
              raise SystemExit(
                  "Penempatan titik pada alamat "
                  "email tidak valid."
              )

          if not domain_pattern.fullmatch(
              domain_part
          ):
              raise SystemExit(
                  "Domain alamat email tidak valid."
              )

          normalized_email = (
              local_part
              + "@"
              + domain_part.lower()
          )

          print(
              "Format alamat email valid."
          )

          print(
              "Domain:",
              domain_part.lower(),
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as environment_file:
              environment_file.write(
                  "NORMALIZED_EMAIL="
                  + normalized_email
                  + "\n"
              )
          PY

      - name: Validasi profil pemeriksaan
        shell: bash
        run: |
          set -euo pipefail

          case "$PROFILE_INPUT" in
            basic|standard|extended)
              echo "Profil valid: $PROFILE_INPUT"
              ;;
            *)
              echo "Profil pemeriksaan tidak valid."
              exit 1
              ;;
          esac

      - name: Siapkan folder laporan
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          rm -rf "$REPORT_FOLDER"

          mkdir -p "$REPORT_FOLDER"

          echo "Folder laporan:"
          echo "$REPORT_FOLDER"

      - name: Periksa modul MailAccess
        shell: bash
        run: |
          set -euo pipefail

          mailaccess modules \
            > "reports/$JOB_ID/modules.txt"

          cat "reports/$JOB_ID/modules.txt"

      - name: Tentukan modul pemeriksaan
        id: module_selection
        shell: bash
        run: |
          set -euo pipefail

          case "$PROFILE_INPUT" in
            basic)
              MODULES="gravatar,domain_intel"
              TIMEOUT="30"
              ;;

            standard)
              MODULES="gravatar,domain_intel,emailrep"
              TIMEOUT="45"
              ;;

            extended)
              MODULES=""
              TIMEOUT="60"
              ;;
          esac

          {
            echo "modules=$MODULES"
            echo "timeout=$TIMEOUT"
          } >> "$GITHUB_OUTPUT"

          echo "Profil: $PROFILE_INPUT"
          echo "Timeout: $TIMEOUT detik"

          if [ -n "$MODULES" ]; then
            echo "Modul: $MODULES"
          else
            echo "Modul: seluruh modul bawaan yang tersedia"
          fi

      - name: Jalankan pemeriksaan terpilih
        if: steps.module_selection.outputs.modules != ''
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          REPORT_FILE="$REPORT_FOLDER/report.json"

          echo "Memulai pemeriksaan email."
          echo "Profil: $PROFILE_INPUT"

          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --modules \
            "${{ steps.module_selection.outputs.modules }}" \
            --timeout \
            "${{ steps.module_selection.outputs.timeout }}" \
            --force \
            --output "$REPORT_FILE"

      - name: Jalankan pemeriksaan lengkap
        if: steps.module_selection.outputs.modules == ''
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          REPORT_FILE="$REPORT_FOLDER/report.json"

          echo "Memulai pemeriksaan lengkap."
          echo "Profil: $PROFILE_INPUT"

          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --timeout \
            "${{ steps.module_selection.outputs.timeout }}" \
            --force \
            --show-collisions \
            --output "$REPORT_FILE"

      - name: Tampilkan isi folder laporan
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          echo "Berkas yang tersedia:"

          find "$REPORT_FOLDER" \
            -maxdepth 3 \
            -type f \
            -printf '%p | %s byte\n' |
            sort || true

      - name: Temukan laporan JSON
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"
          EXPECTED_FILE="$REPORT_FOLDER/report.json"

          if [ -s "$EXPECTED_FILE" ]; then
            echo "Laporan tersedia:"
            echo "$EXPECTED_FILE"
            exit 0
          fi

          FOUND_FILE="$(
            find "$REPORT_FOLDER" \
              -maxdepth 4 \
              -type f \
              -name '*.json' \
              ! -name 'metadata.json' \
              -print |
              head -n 1
          )"

          if [ -z "$FOUND_FILE" ]; then
            echo "Laporan JSON tidak ditemukan."
            exit 1
          fi

          cp "$FOUND_FILE" "$EXPECTED_FILE"

          echo "Laporan dinormalisasi dari:"
          echo "$FOUND_FILE"

      - name: Validasi laporan JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          report_path = (
              Path("reports")
              / job_id
              / "report.json"
          )

          if not report_path.exists():
              raise SystemExit(
                  "Laporan JSON tidak ditemukan."
              )

          if report_path.stat().st_size == 0:
              raise SystemExit(
                  "Laporan JSON kosong."
              )

          raw_content = report_path.read_text(
              encoding="utf-8",
              errors="replace",
          )

          try:
              report = json.loads(
                  raw_content
              )
          except json.JSONDecodeError as error:
              raise SystemExit(
                  "Laporan bukan JSON valid. "
                  "Isi awal: "
                  + raw_content[:500]
              ) from error

          if not isinstance(
              report,
              dict,
          ):
              raise SystemExit(
                  "Struktur laporan harus berupa "
                  "object JSON."
              )

          print(
              "Laporan JSON valid."
          )

          print(
              "Ukuran:",
              report_path.stat().st_size,
              "byte",
          )

          print(
              "Field tingkat atas:"
          )

          for key in sorted(
              report.keys()
          ):
              print(
                  "- " + str(key)
              )
          PY

      - name: Buat salinan laporan CSV
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --modules \
            "${{ steps.module_selection.outputs.modules }}" \
            --timeout \
            "${{ steps.module_selection.outputs.timeout }}" \
            --output "$REPORT_FOLDER/report.csv" \
            || true

      - name: Buat salinan laporan Markdown
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --modules \
            "${{ steps.module_selection.outputs.modules }}" \
            --timeout \
            "${{ steps.module_selection.outputs.timeout }}" \
            --output "$REPORT_FOLDER/report.md" \
            || true

      - name: Buat metadata pekerjaan
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from datetime import (
              datetime,
              timezone,
          )
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          report_folder = (
              Path("reports")
              / job_id
          )

          generated_files = sorted(
              path.name
              for path in report_folder.iterdir()
              if path.is_file()
          )

          metadata = {
              "jobId": job_id,
              "email": os.environ[
                  "NORMALIZED_EMAIL"
              ],
              "profile": os.environ[
                  "PROFILE_INPUT"
              ],
              "status": "completed",
              "createdAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "primaryReport": "report.json",
              "generatedFiles": generated_files,
              "authorizedUseOnly": True,
          }

          metadata_path = (
              report_folder
              / "metadata.json"
          )

          metadata_path.write_text(
              json.dumps(
                  metadata,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "Metadata dibuat:",
              metadata_path,
          )
          PY

      - name: Buat ringkasan analisis
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          job_id = os.environ["JOB_ID"]

          report_folder = (
              Path("reports")
              / job_id
          )

          report = json.loads(
              (
                  report_folder
                  / "report.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          findings = report.get(
              "findings",
              [],
          )

          if not isinstance(
              findings,
              list,
          ):
              findings = []

          exposure_score = report.get(
              "exposure_score",
              report.get(
                  "exposureScore",
                  "Tidak tersedia",
              ),
          )

          risk_level = report.get(
              "risk_level",
              report.get(
                  "riskLevel",
                  "Tidak tersedia",
              ),
          )

          status = report.get(
              "status",
              "Tidak tersedia",
          )

          summary = report.get(
              "summary",
              "Tidak tersedia",
          )

          lines = [
              "# Email OSINT Audit",
              "",
              "## Ringkasan",
              "",
              "- Email: `"
              + os.environ["NORMALIZED_EMAIL"]
              + "`",
              "- Profil: `"
              + os.environ["PROFILE_INPUT"]
              + "`",
              "- Status: `"
              + str(status)
              + "`",
              "- Exposure score: `"
              + str(exposure_score)
              + "`",
              "- Risk level: `"
              + str(risk_level)
              + "`",
              "- Jumlah temuan: `"
              + str(len(findings))
              + "`",
              "",
              "## Ikhtisar",
              "",
              str(summary),
              "",
              "## Temuan Lengkap",
              "",
          ]

          if not findings:
              lines.append(
                  "Tidak ada temuan terstruktur "
                  "dalam field findings."
              )
          else:
              for index, finding in enumerate(
                  findings,
                  start=1,
              ):
                  if not isinstance(
                      finding,
                      dict,
                  ):
                      lines.extend([
                          "### Temuan "
                          + str(index),
                          "",
                          "```text",
                          str(finding),
                          "```",
                          "",
                      ])

                      continue

                  platform = finding.get(
                      "platform",
                      "Tidak diketahui",
                  )

                  confidence = finding.get(
                      "confidence",
                      "Tidak tersedia",
                  )

                  severity = finding.get(
                      "severity",
                      "Tidak tersedia",
                  )

                  url = finding.get(
                      "url",
                      "",
                  )

                  finding_metadata = finding.get(
                      "metadata",
                      {},
                  )

                  lines.extend([
                      "### "
                      + str(index)
                      + ". "
                      + str(platform),
                      "",
                      "- Confidence: `"
                      + str(confidence)
                      + "`",
                      "- Severity: `"
                      + str(severity)
                      + "`",
                  ])

                  if url:
                      lines.append(
                          "- URL: "
                          + str(url)
                      )

                  if finding_metadata:
                      lines.extend([
                          "",
                          "Metadata:",
                          "",
                          "```json",
                          json.dumps(
                              finding_metadata,
                              indent=2,
                              ensure_ascii=False,
                          ),
                          "```",
                      ])

                  lines.append("")

          lines.extend([
              "",
              "## JSON Lengkap",
              "",
              "```json",
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False,
              ),
              "```",
              "",
          ])

          summary_path = (
              report_folder
              / "summary.md"
          )

          summary_path.write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print(
              "Ringkasan dibuat:",
              summary_path,
          )
          PY

      - name: Buat checksum
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FOLDER="reports/$JOB_ID"

          find "$REPORT_FOLDER" \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > "$REPORT_FOLDER/SHA256SUMS.txt"

      - name: Tampilkan daftar laporan akhir
        shell: bash
        run: |
          set -euo pipefail

          echo "Laporan akhir:"

          find "reports/$JOB_ID" \
            -maxdepth 1 \
            -type f \
            -printf '%f | %s byte\n' |
            sort

      - name: Simpan artefak laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailaccess-${{ inputs.job_id }}
          path: reports/${{ inputs.job_id }}/
          retention-days: 7
          if-no-files-found: warn