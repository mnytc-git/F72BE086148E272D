name: Email OSINT Audit

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID pekerjaan"
        required: true
        type: string
      email:
        description: "Alamat email yang diperiksa"
        required: true
        type: string
      profile:
        description: "Profil pemeriksaan"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - standard
          - extended

permissions:
  contents: read

concurrency:
  group: mailaccess-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  investigate:
    name: Jalankan pemeriksaan email
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      JOB_ID: ${{ inputs.job_id }}
      EMAIL_INPUT: ${{ inputs.email }}
      PROFILE_INPUT: ${{ inputs.profile }}

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tampilkan versi Python
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version

      - name: Perbarui alat instalasi
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel

      - name: Instal MailAccess
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "mailaccess==0.14.4"

      - name: Periksa instalasi MailAccess
        shell: bash
        run: |
          set -euo pipefail
          python -m pip show mailaccess
          mailaccess --version
          mailaccess investigate --help

      - name: Validasi masukan
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$JOB_ID" | grep -Eq '^[a-fA-F0-9-]{20,50}$'; then
            echo "ID pekerjaan tidak valid."
            exit 1
          fi

          case "$PROFILE_INPUT" in
            basic|standard|extended) ;;
            *)
              echo "Profil pemeriksaan tidak valid."
              exit 1
              ;;
          esac

          python - <<'PY'
          import os
          import re

          email = os.environ.get("EMAIL_INPUT", "").strip()
          if not email or len(email) > 254 or email.count("@") != 1:
              raise SystemExit("Format alamat email tidak valid.")

          local, domain = email.rsplit("@", 1)
          local_re = re.compile(r"^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]{1,64}$")
          domain_re = re.compile(
              r"^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$"
          )

          if not local_re.fullmatch(local):
              raise SystemExit("Bagian lokal alamat email tidak valid.")
          if local.startswith(".") or local.endswith(".") or ".." in local:
              raise SystemExit("Penempatan titik pada alamat email tidak valid.")
          if not domain_re.fullmatch(domain):
              raise SystemExit("Domain alamat email tidak valid.")

          normalized = local + "@" + domain.lower()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("NORMALIZED_EMAIL=" + normalized + "\n")

          print("ID pekerjaan valid.")
          print("Format alamat email valid.")
          print("Profil valid:", os.environ["PROFILE_INPUT"])
          PY

      - name: Siapkan folder laporan
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FOLDER="reports/$JOB_ID"
          rm -rf "$REPORT_FOLDER"
          mkdir -p "$REPORT_FOLDER"
          echo "Folder laporan: $REPORT_FOLDER"

      - name: Tentukan konfigurasi pemeriksaan
        id: config
        shell: bash
        run: |
          set -euo pipefail

          case "$PROFILE_INPUT" in
            basic)
              MODULES="gravatar,domain_intel"
              TIMEOUT="30"
              ENABLE=""
              ;;
            standard)
              MODULES="gravatar,domain_intel,emailrep"
              TIMEOUT="45"
              ENABLE=""
              ;;
            extended)
              MODULES=""
              TIMEOUT="60"
              ENABLE="all"
              ;;
          esac

          {
            echo "modules=$MODULES"
            echo "timeout=$TIMEOUT"
            echo "enable=$ENABLE"
          } >> "$GITHUB_OUTPUT"

          echo "Profil: $PROFILE_INPUT"
          echo "Timeout: $TIMEOUT detik"
          echo "Modul: ${MODULES:-bawaan dengan opt-in all}"

      - name: Jalankan pemeriksaan basic atau standard
        if: steps.config.outputs.modules != ''
        shell: bash
        run: |
          set -euo pipefail
          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --modules "${{ steps.config.outputs.modules }}" \
            --timeout "${{ steps.config.outputs.timeout }}" \
            --force \
            --output "reports/$JOB_ID/report.json"

      - name: Jalankan pemeriksaan extended
        if: steps.config.outputs.modules == ''
        shell: bash
        run: |
          set -euo pipefail
          mailaccess \
            --no-banner \
            investigate \
            "$NORMALIZED_EMAIL" \
            --format json \
            --timeout "${{ steps.config.outputs.timeout }}" \
            --force \
            --show-collisions \
            --enable "${{ steps.config.outputs.enable }}" \
            --output "reports/$JOB_ID/report.json"

      - name: Validasi dan analisis laporan JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          folder = Path("reports") / os.environ["JOB_ID"]
          path = folder / "report.json"
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("report.json tidak tersedia atau kosong.")

          report = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(report, dict):
              raise SystemExit("Struktur report.json tidak valid.")
          if str(report.get("status", "")).lower() not in {"complete", "completed"}:
              raise SystemExit("Investigasi belum selesai.")

          findings = report.get("findings", [])
          modules = report.get("module_runs", [])
          if not isinstance(findings, list): findings = []
          if not isinstance(modules, list): modules = []

          pivots = sum(
              1 for item in findings
              if isinstance(item, dict) and item.get("module_name") == "username_pivot"
          )
          statuses = Counter(
              str(item.get("status", "unknown"))
              for item in modules if isinstance(item, dict)
          )

          analysis = {
              "status": report.get("status"),
              "findingCount": len(findings),
              "directFindingCount": len(findings) - pivots,
              "usernamePivotCount": pivots,
              "moduleRunCount": len(modules),
              "moduleStatuses": dict(statuses),
              "exposureScore": report.get("exposure_score"),
              "exposureScorePct": report.get("exposure_score_pct"),
              "credentialRiskScore": report.get("credential_risk_score"),
              "credentialRiskBand": report.get("credential_risk_band"),
              "riskLevel": report.get("risk_level"),
              "nameConfidence": report.get("name_confidence"),
          }
          (folder / "analysis.json").write_text(
              json.dumps(analysis, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(json.dumps(analysis, indent=2, ensure_ascii=False))
          PY

      - name: Buat CSV dan Markdown dari snapshot JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import os
          from collections import Counter
          from pathlib import Path

          folder = Path("reports") / os.environ["JOB_ID"]
          report = json.loads((folder / "report.json").read_text(encoding="utf-8"))
          findings = report.get("findings", [])
          runs = report.get("module_runs", [])
          if not isinstance(findings, list): findings = []
          if not isinstance(runs, list): runs = []

          with (folder / "report.csv").open("w", encoding="utf-8", newline="") as f:
              fields = [
                  "module_name", "platform", "profile_url", "username",
                  "confidence", "severity", "source", "created_at", "metadata_json"
              ]
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for finding in findings:
                  if not isinstance(finding, dict): continue
                  data = finding.get("data", {})
                  if not isinstance(data, dict): data = {}
                  metadata = data.get("metadata", {})
                  if not isinstance(metadata, dict): metadata = {}
                  writer.writerow({
                      "module_name": finding.get("module_name", ""),
                      "platform": data.get("platform", ""),
                      "profile_url": data.get("profile_url", data.get("url", "")),
                      "username": data.get("username", ""),
                      "confidence": data.get("confidence", ""),
                      "severity": data.get("severity", ""),
                      "source": metadata.get("source", ""),
                      "created_at": finding.get("created_at", ""),
                      "metadata_json": json.dumps(metadata, ensure_ascii=False, separators=(",", ":")),
                  })

          direct = []
          pivots = []
          for finding in findings:
              if not isinstance(finding, dict): continue
              (pivots if finding.get("module_name") == "username_pivot" else direct).append(finding)

          statuses = Counter(
              str(item.get("status", "unknown"))
              for item in runs if isinstance(item, dict)
          )
          lines = [
              "# Email OSINT Audit", "", "## Ringkasan", "",
              f"- Email: `{os.environ['NORMALIZED_EMAIL']}`",
              f"- Profil: `{os.environ['PROFILE_INPUT']}`",
              f"- Status: `{report.get('status', '')}`",
              f"- Risk level: `{report.get('risk_level', 'Tidak tersedia')}`",
              f"- Exposure score: `{report.get('exposure_score', 'Tidak tersedia')}`",
              f"- Credential risk score: `{report.get('credential_risk_score', 'Tidak tersedia')}`",
              f"- Temuan langsung: `{len(direct)}`",
              f"- Kandidat pivot username: `{len(pivots)}`",
              "", "## Status Modul", ""
          ]
          for key, count in sorted(statuses.items()):
              lines.append(f"- {key}: `{count}`")

          lines += [
              "", "## Catatan Interpretasi", "",
              "Kandidat profil berdasarkan bagian lokal alamat email bukan bukti bahwa setiap profil dimiliki pemilik alamat email.",
              "", "## Kandidat Pivot Username", ""
          ]
          for index, finding in enumerate(pivots, 1):
              data = finding.get("data", {}) if isinstance(finding.get("data"), dict) else {}
              lines.append(
                  f"{index}. {data.get('platform', 'Tidak diketahui')} | "
                  f"confidence: `{data.get('confidence', 'Tidak tersedia')}` | "
                  f"{data.get('profile_url', '')}"
              )

          (folder / "summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Buat metadata pekerjaan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          folder = Path("reports") / os.environ["JOB_ID"]
          metadata = {
              "jobId": os.environ["JOB_ID"],
              "email": os.environ["NORMALIZED_EMAIL"],
              "profile": os.environ["PROFILE_INPUT"],
              "status": "completed",
              "createdAt": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "githubRunId": os.environ.get("GITHUB_RUN_ID", ""),
              "githubRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "primaryReport": "report.json",
              "authorizedUseOnly": True,
          }
          (folder / "metadata.json").write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: Buat checksum
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FOLDER="reports/$JOB_ID"
          rm -f "$REPORT_FOLDER/SHA256SUMS.txt"
          find "$REPORT_FOLDER" \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 | sort -z | xargs -0 sha256sum \
            > "$REPORT_FOLDER/SHA256SUMS.txt"

      - name: Validasi paket laporan
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FOLDER="reports/$JOB_ID"
          REQUIRED_FILES=(
            report.json
            report.csv
            summary.md
            analysis.json
            metadata.json
            SHA256SUMS.txt
          )

          for FILE_NAME in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$REPORT_FOLDER/$FILE_NAME" ]]; then
              echo "File tidak tersedia atau kosong: $FILE_NAME"
              exit 1
            fi
          done

          find "$REPORT_FOLDER" -maxdepth 1 -type f -printf '%f | %s byte\n' | sort

      - name: Periksa sintaks pengirim
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/send_to_apps_script.py
          python -m py_compile scripts/send_to_apps_script.py
          echo "Sintaks pengirim valid."

      - name: Periksa konfigurasi webhook
        id: webhook
        env:
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${APPS_SCRIPT_WEBHOOK_URL:-}" && -n "${CALLBACK_SECRET:-}" ]]; then
            echo "Webhook tersedia. Laporan akan dikirim."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Webhook belum tersedia. Pengiriman dilewati."
            echo "Artefak tetap akan disimpan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Kirim laporan ke Apps Script
        if: steps.webhook.outputs.enabled == 'true'
        env:
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/send_to_apps_script.py "reports/$JOB_ID"

      - name: Laporkan kegagalan ke Apps Script
        if: failure() && steps.webhook.outputs.enabled == 'true'
        env:
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        shell: bash
        run: |
          python scripts/send_to_apps_script.py \
            --failed \
            "$JOB_ID" \
            "Workflow Email OSINT Audit gagal." || true

      - name: Simpan artefak laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailaccess-${{ inputs.job_id }}
          path: reports/${{ inputs.job_id }}/
          retention-days: 7
          if-no-files-found: warn
